name: Fantasy Sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Una sola ejecución a la vez: si la anterior sigue en marcha, la siguiente espera en vez de solaparse.
concurrency:
  group: fantasy-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Ejecutar sincronización
        run: |
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 300 \
            https://clausulazos.onrender.com/fantasy/sync)
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            cat response.json
            exit 1
          fi
          jq '{detectedClauseTransfers, alreadyExists, created, updated, reconciled, skippedUsers}' response.json