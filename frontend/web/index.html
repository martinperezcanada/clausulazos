<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Gestiona los cláusulazos de tu liga Fantasy.">
  <meta name="theme-color" content="#0B0F0D">

  <!-- iOS: makes the installed PWA run without Safari's browser chrome
       and use our own status-bar style instead of the default. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clausulazos">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Android/Chrome: same "installed, standalone app" behaviour. -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Clausulazos</title>
  <link rel="manifest" href="manifest.json">

  <!-- Passkey/WebAuthn browser bridge (see lib/core/webauthn/webauthn_client.dart) -->
  <script src="webauthn.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
